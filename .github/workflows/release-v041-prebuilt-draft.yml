# One-off Posture-C R5 exact-byte release preparation.
#
# This workflow is deliberately:
#   * manual-only (never runs on a tag or branch push),
#   * hard-pinned to one source tree and one already-frozen executable,
#   * incapable of invoking cargo/rustc,
#   * limited to either a temporary public attestation prerelease or a final
#     draft (it cannot publish the final release).
#
# Branch-ready target: release/v041-prebuilt
# Final distribution tag: v0.4.1-testnet
#
# The generic release.yml remains the path for future source-built releases.

name: release-v041-prebuilt-draft

on:
  workflow_dispatch:
    inputs:
      chain_registry_commit:
        description: "Full 40-hex commit containing the reviewed R5 registry candidate"
        required: true
        type: string
      publication_mode:
        description: "Create the temporary attestation prerelease or the final immutable-ready draft"
        required: true
        default: attestation-staging
        type: choice
        options:
          - attestation-staging
          - final-draft
      immutable_releases_enabled:
        description: "Must match the repository state: false for staging, true for the final draft"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "Type the selected mode followed by /477704b1"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-v041-prebuilt-draft
  cancel-in-progress: false

jobs:
  stage-sign-release:
    name: verify, evidence-bind, sign, and stage exact bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: v0.4.1-testnet
      STAGING_RELEASE: _prebuilt-staging-v041
      ATTESTATION_STAGING_TAG: v0.4.1-testnet-attestation-staging
      EXPECTED_CHAIN_REGISTRY_COMMIT: de43e04bc2da6583f43233e7973e49eab0aecb15
      MONO_CORE_COMMIT: f052832c62ad5640fa7a419018bba4b120a18587
      MONO_CORE_TREE: 30a34766f75ee74b39ced71d8158666392f8e8e6
      MONO_CORE_CARGO_LOCK_SHA256: 00249cdc7cbeaac2cdaaae5e4f6a2e1aea8c51f95b3f96d459da5bd6cafe12de
      BINARY_SHA256: 477704b170b620e9b52255b1dc26dddfcadb8664052867c1750ac40e3764851b
      EXPECTED_TARBALL_SHA256: 5d03e6fb7110613b28a18cda013bd16731e5ddb02b0307fea205eacbc97f311e
      BINARY_SIZE: "41707840"
      BINARY_VERSION: 0.4.0
      BINARY_BUILD_TIMESTAMP_UTC: "1784993386"
      BINARY_RUSTC: "rustc 1.93.0 (254b59607 2026-01-19)"
      BINARY_TARGET: x86_64-unknown-linux-gnu
      BINARY_PROFILE: release
      BINARY_FEATURES: default,indexer-postgres,mdbx,mesh,sp1-verifier
      PROTOCORE_FEATURES: mdbx,indexer-postgres,mesh,sp1-verifier
      CLIENT_VERSION: protocore/v2/v0.4.0-testnet-53-gf052832c+f052832c62ad
      CHAIN_ID: "69420"
      GENESIS_HASH: "0x8dfc309dfe8e35b4ca036631c7dc25b29e618ac8a9694e0e2bbe23d0f98ab1fe"
      GENESIS_SHA256: 0a02cabfb7d84cea3e77dcac76990ce3ceda233c7ba0d6f067d2b5b6e53dbb8a
      MILESTONES_SHA256: 7739c3d702b72586dd9880bafedb3967393fab679e4d2e3268d038bcd7c452e7
      NETWORK_REGISTRY_SHA256: ef296a44b8ea83626b9bfcbfff4df6b47049ed0cd910d07defc7dfa2ef7853d4
      ACCEPTANCE_EVIDENCE_SHA256: 77c13973a357f969bbe3c34a97f56104bdcd363d7ade7123eaa36685f1278931
      SOAK_EVIDENCE_SHA256: 11b7457f2476753b37090525f37853393c9b37e5b36c2b015ea96bcb0e3775cd
      FRESH_COLDJOIN_EVIDENCE_SHA256: d90540a60d2af575ec4b7264e5bf909b62eb6b12a6d160378f1d36925b0e94ea
      COLDJOIN_CORRECTION_MANIFEST_SHA256: 81dd1c5d883bf9902ef0acda2ab951cc81977a71dfa3eac5cb1f5eb8bd3fed5b
      ASSET_PLATFORM: x86_64-linux

    steps:
      - name: Preflight the manual one-off inputs
        env:
          CHAIN_REGISTRY_COMMIT: ${{ inputs.chain_registry_commit }}
          PUBLICATION_MODE: ${{ inputs.publication_mode }}
          IMMUTABLE_RELEASES_ENABLED: ${{ inputs.immutable_releases_enabled }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/release/v041-prebuilt" ]] || {
            echo "::error::Run this one-off only from release/v041-prebuilt"
            exit 1
          }
          [[ "$CHAIN_REGISTRY_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::chain_registry_commit must be a full lowercase 40-hex commit"
            exit 1
          }
          [[ "$CHAIN_REGISTRY_COMMIT" == "$EXPECTED_CHAIN_REGISTRY_COMMIT" ]] || {
            echo "::error::chain_registry_commit is not the reviewed exact R5 candidate"
            exit 1
          }
          case "$PUBLICATION_MODE" in
            attestation-staging)
              [[ "$IMMUTABLE_RELEASES_ENABLED" == "false" ]] || {
                echo "::error::Operator must verify immutable releases remain disabled for temporary staging"
                exit 1
              }
              expected_confirmation="attestation-staging/477704b1"
              ;;
            final-draft)
              [[ "$IMMUTABLE_RELEASES_ENABLED" == "true" ]] || {
                echo "::error::Operator must verify immutable releases are enabled before the final draft"
                exit 1
              }
              expected_confirmation="final-draft/477704b1"
              ;;
            *)
              echo "::error::Unknown publication mode"
              exit 1
              ;;
          esac
          [[ "$CONFIRMATION" == "$expected_confirmation" ]] || {
            echo "::error::Exact-cut confirmation did not match"
            exit 1
          }

      - name: Checkout protocore release repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Self-test fail-closed R5 registry gate
        run: |
          set -euo pipefail
          scripts/test-release-v041-registry-entry.sh

      - name: Refuse conflicting release state
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_MODE: ${{ inputs.publication_mode }}
        run: |
          set -euo pipefail
          if [[ "$PUBLICATION_MODE" == "attestation-staging" ]]; then
            target_tag="$ATTESTATION_STAGING_TAG"
          else
            target_tag="$RELEASE_TAG"
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${target_tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${target_tag} already exists; refusing to move or reuse it"
            exit 1
          fi
          release_rows="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              | jq -s --arg tag "$target_tag" \
                  '[.[][] | select(.tag_name == $tag) | {id, draft, prerelease}]'
          )"
          count="$(jq 'length' <<<"$release_rows")"
          [[ "$count" -le 1 ]] || {
            echo "::error::Multiple releases unexpectedly use ${target_tag}"
            exit 1
          }
          if [[ "$count" == 1 ]]; then
            [[ "$PUBLICATION_MODE" == "final-draft" ]] || {
              echo "::error::Temporary staging already exists; run the exact cleanup workflow first"
              exit 1
            }
            jq -e '.[0].draft == true' <<<"$release_rows" >/dev/null || {
              echo "::error::A non-draft ${target_tag} release already exists"
              exit 1
            }
            echo "Existing ${target_tag} draft found; verified rerun may replace draft assets."
          fi
          if [[ "$PUBLICATION_MODE" == "attestation-staging" ]]; then
            conflicting_tag="$RELEASE_TAG"
          else
            conflicting_tag="$ATTESTATION_STAGING_TAG"
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${conflicting_tag}" >/dev/null 2>&1; then
            echo "::error::Conflicting tag ${conflicting_tag} exists; required release order was not preserved"
            exit 1
          fi
          conflicting_releases="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              | jq -s --arg tag "$conflicting_tag" \
                  '[.[][] | select(.tag_name == $tag)] | length'
          )"
          [[ "$conflicting_releases" == "0" ]] || {
            echo "::error::Conflicting ${conflicting_tag} release exists; required release order was not preserved"
            exit 1
          }

      - name: Mint read-only GitHub App token for exact mono-core source
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.MONO_CORE_READ_APP_ID }}
          private-key: ${{ secrets.MONO_CORE_READ_APP_PRIVATE_KEY }}
          owner: monolythium
          repositories: mono-core
          permission-contents: read

      - name: Checkout frozen mono-core source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: monolythium/mono-core
          token: ${{ steps.app_token.outputs.token }}
          path: src
          ref: f052832c62ad5640fa7a419018bba4b120a18587
          fetch-depth: 1

      - name: Verify frozen source identity and local testnet manifests
        id: source
        working-directory: src
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          cargo_lock_sha="$(sha256sum Cargo.lock | awk '{print $1}')"
          [[ "$actual_commit" == "$MONO_CORE_COMMIT" ]]
          [[ "$actual_tree" == "$MONO_CORE_TREE" ]]
          [[ "$cargo_lock_sha" == "$MONO_CORE_CARGO_LOCK_SHA256" ]]
          [[ -d testnet ]]
          manifest_out="${GITHUB_WORKSPACE}/testnet-manifests-${RELEASE_TAG}.sha256"
          find testnet -maxdepth 1 -type f -print0 \
            | sort -z \
            | xargs -0 -r sha256sum >"$manifest_out"
          manifest_inventory_sha="$(sha256sum "$manifest_out" | awk '{print $1}')"
          echo "manifest_path=$manifest_out" >>"$GITHUB_OUTPUT"
          echo "manifest_inventory_sha256=$manifest_inventory_sha" >>"$GITHUB_OUTPUT"

      - name: Checkout commit-pinned R5 chain-registry candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: monolythium/chain-registry
          path: registry
          ref: ${{ inputs.chain_registry_commit }}
          fetch-depth: 1

      - name: Verify R5 registry candidate and canonical bytes
        id: registry
        env:
          CHAIN_REGISTRY_COMMIT: ${{ inputs.chain_registry_commit }}
        run: |
          set -euo pipefail
          [[ "$(git -C registry rev-parse HEAD)" == "$CHAIN_REGISTRY_COMMIT" ]]
          [[ "$CHAIN_REGISTRY_COMMIT" == "$EXPECTED_CHAIN_REGISTRY_COMMIT" ]]
          entry="registry/chains/testnet-69420.toml"
          genesis="registry/chains/genesis/testnet-69420.genesis.toml"
          milestones="registry/chains/milestones/testnet-69420.milestones.toml"
          [[ -f "$genesis" && ! -L "$genesis" ]]
          [[ -f "$milestones" && ! -L "$milestones" ]]
          [[ "$(sha256sum "$genesis" | awk '{print $1}')" == "$GENESIS_SHA256" ]]
          [[ "$(sha256sum "$milestones" | awk '{print $1}')" == "$MILESTONES_SHA256" ]]
          scripts/verify-release-v041-registry-entry.sh "$entry"
          npm --prefix registry ci --ignore-scripts
          npm --prefix registry run validate
          echo "commit=$CHAIN_REGISTRY_COMMIT" >>"$GITHUB_OUTPUT"

      - name: Verify private staging draft and ingest exact executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          staging="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              | jq -s --arg tag "$STAGING_RELEASE" \
                  '[.[][] | select(.tag_name == $tag)]'
          )"
          [[ "$(jq 'length' <<<"$staging")" == 1 ]] || {
            echo "::error::Expected exactly one ${STAGING_RELEASE} draft"
            exit 1
          }
          jq -e '.[0].draft == true' <<<"$staging" >/dev/null || {
            echo "::error::Prebuilt staging release must remain a private draft"
            exit 1
          }
          jq -e '
            (.[0].assets | length) == 1 and
            ([.[0].assets[] | select(.name == "protocore")] | length) == 1
          ' <<<"$staging" >/dev/null || {
            echo "::error::Staging draft must contain only one asset, named protocore"
            exit 1
          }
          mkdir -p ingest
          gh release download "$STAGING_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern protocore \
            --output ingest/protocore
          chmod 0755 ingest/protocore
          [[ "$(sha256sum ingest/protocore | awk '{print $1}')" == "$BINARY_SHA256" ]]

      - name: Verify provenance and deterministically package exact bytes
        id: stage
        run: |
          set -euo pipefail
          scripts/release-v041-prebuilt-stage.sh ingest/protocore "$GITHUB_WORKSPACE"

      - name: Verify exact executable identity and resolve canonical R5 inputs
        env:
          SMOKE_REQUIRED_FEATURES: mdbx,indexer-postgres,mesh,sp1-verifier
          SMOKE_EXPECT_VERSION: "0.4.0"
          SMOKE_SKIP_BOOT: "1"
        run: |
          set -euo pipefail
          binary="${{ steps.stage.outputs.binary_path }}"

          # A truthful Posture-C node boot requires a registry row plus the
          # matching sealed ML-DSA, P2P, and (for relays) PQ identity material.
          # Those custody secrets must never be exported to CI, and a random
          # throwaway key must never impersonate an accepted registry member.
          # Execute the frozen artifact for its complete release identity and
          # canonical genesis resolution here; bind actual node execution to
          # the immutable accepted-fleet, soak, and fresh-coldjoin manifests.
          scripts/release-boot-smoke.sh "$binary"

          smoke_root="$RUNNER_TEMP/r5-registry"
          smoke_chains="$smoke_root/chains"
          rm -rf "$smoke_root"
          mkdir -p "$smoke_chains/genesis" "$smoke_chains/milestones"
          cp registry/chains/testnet-69420.toml "$smoke_chains/"
          cp registry/chains/genesis/testnet-69420.genesis.toml "$smoke_chains/genesis/"
          cp registry/chains/milestones/testnet-69420.milestones.toml "$smoke_chains/milestones/"

          port=18080
          base="http://127.0.0.1:${port}"
          entry="$smoke_chains/testnet-69420.toml"
          sed -i \
            -e "s|^genesis_url[[:space:]]*=.*|genesis_url    = \"${base}/genesis/testnet-69420.genesis.toml\"|" \
            -e "s|^milestones_url[[:space:]]*=.*|milestones_url    = \"${base}/milestones/testnet-69420.milestones.toml\"|" \
            "$entry"

          python3 -m http.server "$port" \
            --bind 127.0.0.1 \
            --directory "$smoke_chains" \
            >"$RUNNER_TEMP/r5-registry-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            curl -fsS "${base}/testnet-69420.toml" >/dev/null && break
            sleep 0.25
          done
          curl -fsS "${base}/testnet-69420.toml" >/dev/null

          resolve_home="$RUNNER_TEMP/r5-resolve-home"
          "$binary" --home "$resolve_home" init testnet --no-operator >/dev/null
          "$binary" --home "$resolve_home" genesis resolve \
            --registry-network testnet-69420 \
            --registry-url "$base" \
            --no-write-peers >/dev/null
          [[ "$(sha256sum "$resolve_home/genesis.toml" | awk '{print $1}')" == "$GENESIS_SHA256" ]]

          for evidence_sha in \
            "$ACCEPTANCE_EVIDENCE_SHA256" \
            "$SOAK_EVIDENCE_SHA256" \
            "$FRESH_COLDJOIN_EVIDENCE_SHA256" \
            "$COLDJOIN_CORRECTION_MANIFEST_SHA256"
          do
            [[ "$evidence_sha" =~ ^[0-9a-f]{64}$ ]]
          done
          {
            echo "### Immutable R5 live-execution evidence"
            echo
            echo "Acceptance manifest: \`${ACCEPTANCE_EVIDENCE_SHA256}\`"
            echo "Soak manifest: \`${SOAK_EVIDENCE_SHA256}\`"
            echo "Fresh-coldjoin manifest: \`${FRESH_COLDJOIN_EVIDENCE_SHA256}\`"
            echo "Coldjoin correction manifest: \`${COLDJOIN_CORRECTION_MANIFEST_SHA256}\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign deterministic tarball with GitHub OIDC
        env:
          ASSET: ${{ steps.stage.outputs.asset_path }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature "${ASSET}.sig" \
            --output-certificate "${ASSET}.pem" \
            "$ASSET"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: ${{ steps.stage.outputs.asset_path }}
          format: spdx-json
          output-file: ${{ steps.stage.outputs.asset_path }}.spdx.json

      - name: Write dual-identity release metadata
        env:
          ASSET: ${{ steps.stage.outputs.asset }}
          TARBALL_SHA256: ${{ steps.stage.outputs.tarball_sha256 }}
          RELEASE_INFO_ASSET: ${{ steps.stage.outputs.release_info_path }}
          MANIFEST_INVENTORY_SHA256: ${{ steps.source.outputs.manifest_inventory_sha256 }}
          CHAIN_REGISTRY_COMMIT: ${{ steps.registry.outputs.commit }}
          PUBLICATION_MODE: ${{ inputs.publication_mode }}
        run: |
          set -euo pipefail
          metadata="out/release-${RELEASE_TAG}.json"
          release_info_name="$(basename "$RELEASE_INFO_ASSET")"
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg asset "$ASSET" \
            --arg platform "$ASSET_PLATFORM" \
            --arg tarball_sha256 "$TARBALL_SHA256" \
            --arg binary_sha256 "$BINARY_SHA256" \
            --arg binary_size "$BINARY_SIZE" \
            --arg binary_version "$BINARY_VERSION" \
            --arg build_timestamp_utc "$BINARY_BUILD_TIMESTAMP_UTC" \
            --arg rustc "$BINARY_RUSTC" \
            --arg target "$BINARY_TARGET" \
            --arg profile "$BINARY_PROFILE" \
            --arg features "$BINARY_FEATURES" \
            --arg client_version "$CLIENT_VERSION" \
            --arg source_commit "$MONO_CORE_COMMIT" \
            --arg source_tree "$MONO_CORE_TREE" \
            --arg cargo_lock_sha256 "$MONO_CORE_CARGO_LOCK_SHA256" \
            --arg chain_registry_commit "$CHAIN_REGISTRY_COMMIT" \
            --arg chain_id "$CHAIN_ID" \
            --arg genesis_hash "$GENESIS_HASH" \
            --arg genesis_sha256 "$GENESIS_SHA256" \
            --arg milestones_sha256 "$MILESTONES_SHA256" \
            --arg network_registry_sha256 "$NETWORK_REGISTRY_SHA256" \
            --arg acceptance_evidence_sha256 "$ACCEPTANCE_EVIDENCE_SHA256" \
            --arg soak_evidence_sha256 "$SOAK_EVIDENCE_SHA256" \
            --arg fresh_coldjoin_evidence_sha256 "$FRESH_COLDJOIN_EVIDENCE_SHA256" \
            --arg coldjoin_correction_manifest_sha256 "$COLDJOIN_CORRECTION_MANIFEST_SHA256" \
            --arg manifest_inventory_sha256 "$MANIFEST_INVENTORY_SHA256" \
            --arg staging_release "$STAGING_RELEASE" \
            --arg attestation_staging_tag "$ATTESTATION_STAGING_TAG" \
            --arg publication_mode "$PUBLICATION_MODE" \
            --arg workflow_commit "$GITHUB_SHA" \
            --arg release_info "$release_info_name" \
            '{
              schemaVersion: 3,
              tag: $tag,
              channel: "testnet",
              distribution: {
                release_tag: $tag,
                binary_version: $binary_version,
                embedded_release_tag: null,
                client_version: $client_version,
                alias_policy: "exact tuple: release tag + source commit + extracted binary sha256"
              },
              source: {
                repository: "monolythium/mono-core",
                commit: $source_commit,
                tree: $source_tree,
                cargo_lock_sha256: $cargo_lock_sha256
              },
              build: {
                binary_size: ($binary_size | tonumber),
                build_timestamp_utc: ($build_timestamp_utc | tonumber),
                rustc: $rustc,
                target: $target,
                profile: $profile,
                features: ($features | split(","))
              },
              chain: {
                chain_id: ($chain_id | tonumber),
                genesis_hash: $genesis_hash,
                genesis_sha256: $genesis_sha256,
                milestones_sha256: $milestones_sha256,
                network_registry_sha256: $network_registry_sha256,
                chain_registry_commit: $chain_registry_commit,
                testnet_manifest_inventory_sha256: $manifest_inventory_sha256
              },
              live_execution_evidence: {
                acceptance_manifest_sha256: $acceptance_evidence_sha256,
                soak_manifest_sha256: $soak_evidence_sha256,
                fresh_coldjoin_manifest_sha256: $fresh_coldjoin_evidence_sha256,
                coldjoin_correction_manifest_sha256: $coldjoin_correction_manifest_sha256,
                ci_boot_skipped: true,
                ci_boot_skip_reason: "Posture-C exact node identity requires sealed custody material that must not be exported to CI"
              },
              platforms: {
                ($platform): {
                  asset: $asset,
                  tarball_sha256: $tarball_sha256,
                  extracted_binary_sha256: $binary_sha256,
                  binary_digest: ("protocore-" + $tag + "-" + $platform + ".binary.sha256"),
                  release_info: $release_info,
                  signature: ($asset + ".sig"),
                  certificate: ($asset + ".pem"),
                  sbom: ($asset + ".spdx.json")
                }
              },
              provenance: {
                mode: "prebuilt-ingest",
                staging_release: $staging_release,
                workflow_commit: $workflow_commit,
                rebuilt: false
              },
              publication: {
                carrier_mode: $publication_mode,
                carrier_tag: (
                  if $publication_mode == "attestation-staging"
                  then $attestation_staging_tag
                  else $tag
                  end
                ),
                temporary_attestation_staging: ($publication_mode == "attestation-staging"),
                draft_only: ($publication_mode == "final-draft"),
                immutable_release_required: true,
                attestation_bundle_required_before_publish: true
              }
            }' >"$metadata"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg binary_sha "$BINARY_SHA256" \
            --arg tar_sha "$TARBALL_SHA256" \
            --arg binary_size "$BINARY_SIZE" \
            --arg network_registry_sha "$NETWORK_REGISTRY_SHA256" \
            --arg chain_registry_commit "$EXPECTED_CHAIN_REGISTRY_COMMIT" \
            --arg acceptance_evidence_sha "$ACCEPTANCE_EVIDENCE_SHA256" \
            --arg soak_evidence_sha "$SOAK_EVIDENCE_SHA256" \
            --arg fresh_coldjoin_evidence_sha "$FRESH_COLDJOIN_EVIDENCE_SHA256" \
            --arg coldjoin_correction_manifest_sha "$COLDJOIN_CORRECTION_MANIFEST_SHA256" \
            --arg publication_mode "$PUBLICATION_MODE" \
            '
              .schemaVersion == 3 and
              .tag == $tag and
              .distribution.binary_version == "0.4.0" and
              .distribution.embedded_release_tag == null and
              .build.binary_size == ($binary_size | tonumber) and
              .chain.network_registry_sha256 == $network_registry_sha and
              .chain.chain_registry_commit == $chain_registry_commit and
              .live_execution_evidence.acceptance_manifest_sha256 == $acceptance_evidence_sha and
              .live_execution_evidence.soak_manifest_sha256 == $soak_evidence_sha and
              .live_execution_evidence.fresh_coldjoin_manifest_sha256 == $fresh_coldjoin_evidence_sha and
              .live_execution_evidence.coldjoin_correction_manifest_sha256 == $coldjoin_correction_manifest_sha and
              .live_execution_evidence.ci_boot_skipped == true and
              .live_execution_evidence.ci_boot_skip_reason ==
                "Posture-C exact node identity requires sealed custody material that must not be exported to CI" and
              .platforms["x86_64-linux"].extracted_binary_sha256 == $binary_sha and
              .platforms["x86_64-linux"].tarball_sha256 == $tar_sha and
              .publication.carrier_mode == $publication_mode and
              .publication.temporary_attestation_staging ==
                ($publication_mode == "attestation-staging") and
              .publication.draft_only == ($publication_mode == "final-draft")
            ' "$metadata" >/dev/null
          [[ "$TARBALL_SHA256" == "$EXPECTED_TARBALL_SHA256" ]]

      - name: Create temporary public attestation prerelease
        if: ${{ inputs.publication_mode == 'attestation-staging' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v0.4.1-testnet-attestation-staging
          target_commitish: ${{ github.sha }}
          name: v0.4.1-testnet attestation staging
          draft: false
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            TEMPORARY PUBLIC ATTESTATION STAGING — NOT A DISTRIBUTION RELEASE.

            These checksum-locked assets exist only so mono-core can attest the
            exact frozen R5 bytes without a cross-repository credential. Release
            metadata binds the bytes to the accepted fleet, soak, and fresh
            coldjoin evidence manifests. Delete this prerelease and its tag after
            capturing the attestation artifact, then enable immutable releases
            before creating the final draft.
          files: |
            ${{ steps.stage.outputs.asset_path }}
            ${{ steps.stage.outputs.tarball_digest_path }}
            ${{ steps.stage.outputs.binary_digest_path }}
            ${{ steps.stage.outputs.release_info_path }}
            ${{ steps.stage.outputs.asset_path }}.sig
            ${{ steps.stage.outputs.asset_path }}.pem
            ${{ steps.stage.outputs.asset_path }}.spdx.json
            ${{ steps.source.outputs.manifest_path }}
            out/release-v0.4.1-testnet.json

      - name: Create or update final release as DRAFT ONLY
        if: ${{ inputs.publication_mode == 'final-draft' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v0.4.1-testnet
          target_commitish: ${{ github.sha }}
          name: v0.4.1-testnet
          draft: true
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Posture-C R5 exact-byte testnet distribution draft.

            DO NOT PUBLISH until the independent mono-core ML-DSA attestation
            bundle has been attached and every draft asset has been downloaded
            and reverified. The distribution tag is v0.4.1-testnet; the frozen
            executable truthfully reports binary version 0.4.0. The release
            metadata binds these exact bytes to immutable accepted-fleet, soak,
            and fresh-coldjoin evidence.
          files: |
            ${{ steps.stage.outputs.asset_path }}
            ${{ steps.stage.outputs.tarball_digest_path }}
            ${{ steps.stage.outputs.binary_digest_path }}
            ${{ steps.stage.outputs.release_info_path }}
            ${{ steps.stage.outputs.asset_path }}.sig
            ${{ steps.stage.outputs.asset_path }}.pem
            ${{ steps.stage.outputs.asset_path }}.spdx.json
            ${{ steps.source.outputs.manifest_path }}
            out/release-v0.4.1-testnet.json

      - name: Prove exact temporary attestation staging
        if: ${{ inputs.publication_mode == 'attestation-staging' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="[]"
          for _ in $(seq 1 20); do
            release="$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
                | jq -s --arg tag "$ATTESTATION_STAGING_TAG" \
                    '[.[][] | select(.tag_name == $tag)]'
            )"
            if jq -e \
              --arg commit "$GITHUB_SHA" \
              '
                length == 1 and
                .[0].draft == false and
                .[0].prerelease == true and
                .[0].target_commitish == $commit and
                (.[0].assets | length) == 9
              ' <<<"$release" >/dev/null
            then
              break
            fi
            sleep 1
          done
          [[ "$(jq 'length' <<<"$release")" == 1 ]]
          jq -e \
            --arg commit "$GITHUB_SHA" \
            '
              .[0].draft == false and
              .[0].prerelease == true and
              .[0].target_commitish == $commit
            ' <<<"$release" >/dev/null
          required_assets="$(
            jq -nc --arg asset "protocore-${RELEASE_TAG}-${ASSET_PLATFORM}.tar.gz" '
              [
                $asset,
                ($asset + ".sha256"),
                "protocore-v0.4.1-testnet-x86_64-linux.binary.sha256",
                "protocore-v0.4.1-testnet-x86_64-linux.release-info.json",
                ($asset + ".sig"),
                ($asset + ".pem"),
                ($asset + ".spdx.json"),
                "testnet-manifests-v0.4.1-testnet.sha256",
                "release-v0.4.1-testnet.json"
              ] | sort
            '
          )"
          actual_assets="$(jq -c '.[0].assets | map(.name) | sort' <<<"$release")"
          [[ "$actual_assets" == "$required_assets" ]] || {
            echo "::error::Temporary staging asset set is not exact"
            exit 1
          }
          ref="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${ATTESTATION_STAGING_TAG}"
          )"
          jq -e \
            --arg commit "$GITHUB_SHA" \
            '.object.type == "commit" and .object.sha == $commit' \
            <<<"$ref" >/dev/null
          echo "PASS: exact temporary attestation prerelease is public and checksum-locked."

      - name: Prove final release remains a draft
        if: ${{ inputs.publication_mode == 'final-draft' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="[]"
          for _ in $(seq 1 20); do
            release="$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
                | jq -s --arg tag "$RELEASE_TAG" \
                    '[.[][] | select(.tag_name == $tag)]'
            )"
            if jq -e \
              'length == 1 and .[0].draft == true and .[0].prerelease == true and (.[0].assets | length) == 9' \
              <<<"$release" >/dev/null
            then
              break
            fi
            sleep 1
          done
          [[ "$(jq 'length' <<<"$release")" == 1 ]]
          jq -e '.[0].draft == true and .[0].prerelease == true' <<<"$release" >/dev/null
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Draft preparation unexpectedly created a Git tag"
            exit 1
          fi
          echo "PASS: ${RELEASE_TAG} remains a draft; no release tag was created."
