name: release

on:
  push:
    tags:
      - 'v*-testnet'
      - 'v*-mainnet'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # AUD-0079: public-profile chains (e.g. 69420) refuse to boot without the
      # SP1 zkML verifier (runtime `enforce_production_zkml_backend`). The fleet
      # binary ships BOTH `sp1-bridge-verifier` (bridge Groth16) and
      # `sp1-verifier` (agent zkML); a release built without `sp1-verifier`
      # crash-loops at boot. Keep both to match the fleet feature set.
      PROTOCORE_FEATURES: mdbx,indexer-postgres,mesh,sp1-bridge-verifier,sp1-verifier
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset_platform: x86_64-linux

    # Postgres for the release-gate boot smoke test: the artifact must clear
    # the AUD-0032 durable-indexer boot gate against a real Postgres before
    # it can be cosigned/published.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: protocore
          POSTGRES_PASSWORD: protocore
          POSTGRES_DB: protocore_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U protocore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout protocore (release repo)
        uses: actions/checkout@v4

      - name: Mint GitHub App installation token for mono-core
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MONO_CORE_READ_APP_ID }}
          private-key: ${{ secrets.MONO_CORE_READ_APP_PRIVATE_KEY }}
          owner: monolythium
          repositories: mono-core

      - name: Checkout mono-core source
        uses: actions/checkout@v4
        with:
          repository: monolythium/mono-core
          token: ${{ steps.app_token.outputs.token }}
          path: src
          ref: master
          fetch-depth: 0

      - name: Capture source commit
        id: src
        working-directory: src
        run: |
          commit=$(git rev-parse HEAD)
          short=$(git rev-parse --short=12 HEAD)
          echo "commit=$commit"        >> "$GITHUB_OUTPUT"
          echo "short=$short"          >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: cargo build --release -p protocore
        working-directory: src
        env:
          # Embed the exact release tag into the binary's self-reported version
          # (rpc/runtime/p2p build.rs read this, resolution order #1) so
          # web3_clientVersion = protocore/v2/<tag>+<commit> and Monarch's
          # release-matcher + confirm-by-commit can map a running node to this
          # published release. Without it the build falls back to a git-describe
          # string and the node reports 0.1.0+<commit> (unmatchable).
          PROTOCORE_RELEASE_TAG: ${{ github.ref_name }}
        run: cargo build --release --locked -p protocore --features "$PROTOCORE_FEATURES" --target ${{ matrix.target }}

      - name: Stage artifacts
        id: stage
        env:
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.asset_platform }}
        run: |
          set -euo pipefail
          mkdir -p out work
          cp "src/target/${{ matrix.target }}/release/protocore" work/protocore
          chmod 0755 work/protocore
          asset="protocore-${TAG}-${PLATFORM}.tar.gz"
          tar -czf "out/${asset}" -C work protocore
          ( cd out && sha256sum "${asset}" > "${asset}.sha256" )
          sha=$(cut -d' ' -f1 "out/${asset}.sha256")
          echo "asset=${asset}"        >> "$GITHUB_OUTPUT"
          echo "asset_path=out/${asset}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha}"         >> "$GITHUB_OUTPUT"

      # Release gate (mono-core #157 + the 2026-07-02 v0.3.2 postmortem):
      # execute the EXACT staged bytes before anything is cosigned or
      # published. Phase 1 asserts the compile-time feature manifest
      # (`protocore release info`, embedded via build.rs BUILD_FEATURES)
      # contains every fleet feature — a build missing `sp1-verifier`
      # (the v0.3.2 cutover incident: a release.yml feature edit dropped it
      # and all 22 fleet nodes crash-looped on the AUD-0079 boot gate) or
      # `indexer-postgres` (the 2026-06-27 lyth-val-1 crash-loop, AUD-0032)
      # fails here. Phase 2 boots the artifact in full-node mode against the
      # canonical chain-registry genesis + milestones with a real Postgres
      # and requires it to clear the fail-fast boot gates and stay up.
      #
      # PREBUILT-INGEST NOTE: release/v*-prebuilt branches replace only the
      # build step with a staged-binary download. Keep THIS step (and the
      # job-level postgres service) intact on those branches — the gate must
      # cover ingested binaries too; it runs on `work/protocore`, the same
      # bytes both paths stage into the published tarball.
      - name: Boot-smoke the staged artifact (release gate)
        env:
          SMOKE_REQUIRED_FEATURES: ${{ env.PROTOCORE_FEATURES }}
          SMOKE_POSTGRES_URL: postgres://protocore:protocore@localhost:5432/protocore_smoke
          SMOKE_TESTNET_MANIFEST_DIR: src/testnet
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # v0.3.2-testnet -> 0.3.2: the crate version the binary must
          # self-report for this tag.
          v="${TAG#v}"
          v="${v%-testnet}"
          v="${v%-mainnet}"
          export SMOKE_EXPECT_VERSION="$v"
          # chain-registry slug per channel. A mainnet tag requires the
          # registry's mainnet entry to exist (currently reserved/TBD) —
          # failing the resolve there is correct: a release that cannot
          # boot against its network's canonical genesis must not ship.
          case "${TAG}" in
            *-mainnet) export SMOKE_REGISTRY_NETWORK="mainnet" ;;
            *)         export SMOKE_REGISTRY_NETWORK="testnet-69420" ;;
          esac
          ./scripts/release-boot-smoke.sh work/protocore

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign sign-blob (keyless OIDC)
        env:
          ASSET: ${{ steps.stage.outputs.asset_path }}
        run: |
          cosign sign-blob --yes \
            --output-signature   "${ASSET}.sig" \
            --output-certificate "${ASSET}.pem" \
            "${ASSET}"

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          file: ${{ steps.stage.outputs.asset_path }}
          format: spdx-json
          output-file: ${{ steps.stage.outputs.asset_path }}.spdx.json

      - name: Write release metadata
        env:
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.asset_platform }}
          PROTOCORE_FEATURES: ${{ env.PROTOCORE_FEATURES }}
          ASSET: ${{ steps.stage.outputs.asset }}
          SHA256: ${{ steps.stage.outputs.sha256 }}
          MONO_CORE_COMMIT: ${{ steps.src.outputs.commit }}
        run: |
          channel="testnet"
          case "${TAG}" in
            *-mainnet) channel="mainnet" ;;
          esac
          jq -n \
            --arg tag "${TAG}" \
            --arg channel "${channel}" \
            --arg released_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg asset "${ASSET}" \
            --arg sha256 "${SHA256}" \
            --arg signature "${ASSET}.sig" \
            --arg certificate "${ASSET}.pem" \
            --arg sbom "${ASSET}.spdx.json" \
            --arg platform "${PLATFORM}" \
            --arg features "${PROTOCORE_FEATURES}" \
            --arg mono_core_commit "${MONO_CORE_COMMIT}" \
            '{
              tag: $tag,
              channel: $channel,
              released_at: $released_at,
              platforms: {
                ($platform): {
                  asset: $asset,
                  sha256: $sha256,
                  signature: $signature,
                  certificate: $certificate,
                  sbom: $sbom
                }
              },
              compatibility: {
                mono_core_commit: ($mono_core_commit[0:12]),
                cargo_features: ($features | split(","))
              }
            }' > out/release-${TAG}.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-testnet') }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.stage.outputs.asset_path }}
            ${{ steps.stage.outputs.asset_path }}.sha256
            ${{ steps.stage.outputs.asset_path }}.sig
            ${{ steps.stage.outputs.asset_path }}.pem
            ${{ steps.stage.outputs.asset_path }}.spdx.json
            out/release-${{ github.ref_name }}.json
